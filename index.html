<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="新しいアプリ">
<meta name="theme-color" content="#fdf3e3">
<title>新しいアプリ（仮）</title>
<style>
/* 新しいアプリ（仮） 版 0.4 ── 会話の画面、保存、部屋とスレッド、AIと話す（Claude・Gemini） */
:root{
  --sand:#faf6ee; --text:#37474f; --soft:#5d6c73; --line:#e4dccc; --sea:#3f7585;
  --skyA:#fdf3e3; --skyB:#e8f3f5;
  /* 文字欄の色（あとで部屋ごとに選べるようにする。今は AI=白、自分=水色） */
  --ai-bg:#ffffff; --ai-line:#e4dccc; --ai-text:#37474f;
  --me-bg:#eaf5f8; --me-line:#cfe4ea; --me-text:#37474f;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--sand); }
body{
  position:fixed; top:0; left:0; right:0; bottom:0; width:100%;
  color:var(--text); font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  -webkit-text-size-adjust:100%;
}
#app{
  position:fixed; top:0; left:0; right:0; height:100dvh;
  display:flex; flex-direction:column; background:var(--sand);
}
header{
  flex-shrink:0;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px;
  background:linear-gradient(160deg,var(--skyA) 0%,var(--skyB) 80%,var(--sand) 100%);
  border-bottom:1px solid var(--line);
}
.top{ display:flex; align-items:flex-start; gap:12px; }
.titles{ flex:1; min-width:0; }
.plain{
  flex-shrink:0; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:14px;
  background:#fffdf9; color:var(--sea); font:inherit; font-size:15px; font-weight:700;
}
header h1{ margin:0; font-size:20px; font-weight:700; letter-spacing:.02em; }
header h1 small{ font-size:13px; font-weight:400; color:var(--soft); margin-left:8px; }
#where{ margin:3px 0 0; font-size:14px; color:var(--soft); }
#state{ margin:3px 0 0; font-size:12px; color:var(--soft); }
#list{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; padding:18px 18px 14px;
  display:flex; flex-direction:column; gap:14px;
}
.note{
  align-self:center; max-width:34em; text-align:center; font-size:15px; line-height:1.8;
  color:var(--soft); padding:10px 16px; border:1px dashed var(--line); border-radius:16px; background:#fffdf9;
}
.row{ display:flex; flex-direction:column; max-width:80%; }
.row.me{ align-self:flex-end; align-items:flex-end; }
.row.ai{ align-self:flex-start; align-items:flex-start; }
.msg{ padding:12px 15px; font-size:17px; line-height:1.8; white-space:pre-wrap; word-break:break-word; overflow-wrap:break-word; }
.row.ai .msg{ background:var(--ai-bg); border:1px solid var(--ai-line); color:var(--ai-text); border-radius:20px 20px 20px 6px; }
.row.me .msg{ background:var(--me-bg); border:1px solid var(--me-line); color:var(--me-text); border-radius:20px 20px 6px 20px; }
.under{ display:flex; gap:12px; align-items:center; margin-top:4px; padding:0 6px; font-size:12px; color:var(--soft); }
.under button{
  border:none; background:none; color:var(--sea); font:inherit; font-size:13px;
  padding:6px 4px; min-height:32px;
}
footer{
  flex-shrink:0; display:flex; gap:10px; align-items:flex-end; position:relative;
  padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  background:#fffdf9; border-top:1px solid var(--line);
}
textarea{
  flex:1; min-width:0; resize:none; border:1px solid var(--line); border-radius:18px;
  background:#ffffff; color:var(--text); padding:11px 15px;
  font:inherit; font-size:17px; line-height:27px; height:51px; max-height:160px; overflow-y:auto;
  outline:none;
}
textarea:focus{ border-color:#9cc3cf; }
#send{
  flex-shrink:0; min-height:48px; min-width:84px; padding:0 18px; border:none; border-radius:16px;
  background:var(--sea); color:#fff; font:inherit; font-size:16px; font-weight:700;
}
button:focus-visible{ outline:3px solid #9cc3cf; outline-offset:2px; }
/* 入力欄の高さを測るための、見えない写し */
#mirror{
  position:absolute; left:-9999px; top:0; visibility:hidden; pointer-events:none;
  border:1px solid transparent; padding:11px 15px; font:inherit; font-size:17px; line-height:27px;
  white-space:pre-wrap; word-break:break-word; overflow-wrap:break-word;
}
/* 部屋とスレッドの画面 */
.panel{
  position:absolute; inset:0; z-index:5; background:var(--sand);
  display:flex; flex-direction:column;
}
.panel[hidden], #dlg[hidden]{ display:none; }
.phead{
  flex-shrink:0; display:flex; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px;
  background:linear-gradient(160deg,var(--skyA) 0%,var(--skyB) 80%,var(--sand) 100%);
  border-bottom:1px solid var(--line);
}
.phead h2{ flex:1; margin:0; font-size:20px; }
.pbody{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  display:flex; flex-direction:column; gap:16px;
}
.room{ background:#fffdf9; border:1px solid var(--line); border-radius:20px; padding:14px; }
.rhead{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
.rhead h3{ flex:1; min-width:8em; margin:0; font-size:18px; word-break:break-word; }
.small{
  min-height:40px; padding:0 12px; border:1px solid var(--line); border-radius:12px;
  background:#ffffff; color:var(--sea); font:inherit; font-size:14px;
}
.small.danger{ color:#a14a3c; }
.thread{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
.topen{
  flex:1; min-width:10em; min-height:48px; text-align:left; padding:8px 12px; border:1px solid var(--line);
  border-radius:14px; background:#ffffff; color:var(--text); font:inherit; font-size:16px; line-height:1.5; word-break:break-word;
}
.topen.now{ background:var(--me-bg); border-color:var(--me-line); font-weight:700; }
.topen small{ display:block; font-size:12px; font-weight:400; color:var(--soft); }
.add{
  width:100%; min-height:48px; margin-top:10px; border:1px dashed #b9cfd6; border-radius:14px;
  background:#f4fafb; color:var(--sea); font:inherit; font-size:16px; font-weight:700;
}
.bar{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.bar .plain{ min-height:40px; font-size:14px; padding:0 12px; }
.field{ background:#fffdf9; border:1px solid var(--line); border-radius:20px; padding:16px; }
.field h3{ margin:0 0 6px; font-size:17px; }
.field p{ margin:0 0 10px; font-size:14px; line-height:1.8; color:var(--soft); }
.field input{
  width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:14px;
  background:#fff; color:var(--text); font:inherit; font-size:17px; outline:none;
}
.field input:focus{ border-color:#9cc3cf; }
.go{
  width:100%; min-height:50px; border:none; border-radius:16px; background:var(--sea); color:#fff;
  font:inherit; font-size:17px; font-weight:700;
}
.group{ margin:4px 4px -6px; font-size:14px; font-weight:700; color:var(--soft); }
.model{
  width:100%; min-height:56px; text-align:left; padding:10px 14px; border:1px solid var(--line); border-radius:16px;
  background:#fffdf9; color:var(--text); font:inherit; font-size:17px; line-height:1.5;
}
.model{ display:flex; align-items:center; gap:12px; }
.mname{ flex:1; min-width:0; }
.mprice{ flex-shrink:0; text-align:right; padding:6px 10px; border-radius:12px; background:#e3f1f4; font-size:16px; font-weight:400; }
.model.now{ background:var(--me-bg); border-color:var(--me-line); font-weight:700; }
.model small{ display:block; font-size:13px; font-weight:400; color:var(--soft); }
.note .detail{ display:block; margin-top:6px; font-size:12px; word-break:break-word; }
.note button{
  display:block; margin:10px auto 0; min-height:44px; padding:0 18px; border:none; border-radius:14px;
  background:var(--sea); color:#fff; font:inherit; font-size:15px; font-weight:700;
}
.msg.wait{ color:var(--soft); }
#send:disabled{ opacity:.45; }
#dlgArea{
  width:100%; height:300px; max-height:45vh; margin:0 0 14px; padding:11px 14px; border:1px solid var(--line); border-radius:14px;
  background:#fff; color:var(--text); font:inherit; font-size:17px; line-height:1.7; outline:none; resize:none;
}
#dlgArea:focus{ border-color:#9cc3cf; }
#toast{
  position:absolute; left:50%; top:calc(env(safe-area-inset-top,0px) + 14px); z-index:12;
  transform:translate(-50%,-12px); max-width:86%; padding:12px 20px; border-radius:18px;
  background:#37474f; color:#fff; font-size:16px; line-height:1.6; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
#toast.on{ opacity:1; transform:translate(-50%,0); }
/* たずねる小窓 */
#dlg{
  position:absolute; inset:0; z-index:9; background:rgba(55,71,79,.28);
  display:flex; align-items:flex-start; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 50px) 18px 18px; overflow-y:auto;
}
#dlg .card{
  width:100%; max-width:560px; background:#fffdf9; border:1px solid var(--line); border-radius:22px; padding:20px;
  box-shadow:0 12px 40px rgba(55,71,79,.18);
}
#dlgText{ margin:0 0 14px; font-size:17px; line-height:1.8; white-space:pre-line; }
#dlgInput{
  width:100%; margin:0 0 14px; padding:11px 14px; border:1px solid var(--line); border-radius:14px;
  background:#fff; color:var(--text); font:inherit; font-size:17px; outline:none;
}
#dlgInput:focus{ border-color:#9cc3cf; }
#dlg .btns{ display:flex; gap:10px; justify-content:flex-end; }
#dlg .btns button{ min-height:48px; min-width:96px; padding:0 16px; border-radius:14px; font:inherit; font-size:16px; font-weight:700; }
#dlgNo{ border:1px solid var(--line); background:#fff; color:var(--text); }
#dlgYes{ border:none; background:var(--sea); color:#fff; }
.label{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div class="titles">
        <h1>新しいアプリ<small>（仮）版 0.4</small></h1>
        <p id="where">じゅんび中…</p>
      </div>
    </div>
    <div class="bar">
      <button id="openRooms" class="plain" type="button">部屋の一覧</button>
      <button id="openModels" class="plain" type="button">モデル</button>
      <button id="openSettings" class="plain" type="button">設定</button>
    </div>
    <p id="state" aria-hidden="true"></p>
  </header>
  <main id="list" aria-live="polite"></main>
  <footer>
    <label class="label" for="msg">メッセージ</label>
    <textarea id="msg" rows="1" placeholder="メッセージを書く"></textarea>
    <button id="send" type="button">送る</button>
    <div id="mirror" aria-hidden="true"></div>
  </footer>
  <section id="rooms" class="panel" hidden aria-label="部屋の一覧">
    <div class="phead">
      <h2>部屋の一覧</h2>
      <button id="closeRooms" class="plain" type="button">閉じる</button>
    </div>
    <div id="roomList" class="pbody"></div>
  </section>
  <section id="models" class="panel" hidden aria-label="モデルを選ぶ">
    <div class="phead">
      <h2>モデルを選ぶ</h2>
      <button id="closeModels" class="plain" type="button">閉じる</button>
    </div>
    <div id="modelList" class="pbody"></div>
  </section>
  <section id="settings" class="panel" hidden aria-label="設定">
    <div class="phead">
      <h2>設定</h2>
      <button id="closeSettings" class="plain" type="button">閉じる</button>
    </div>
    <div class="pbody">
      <div class="field">
        <h3>ClaudeのAPIキー</h3>
        <p>Claude Console で作ったキーを貼ってください。</p>
        <input id="keyClaude" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…">
      </div>
      <div class="field">
        <h3>GeminiのAPIキー</h3>
        <p>Google AI Studio で作ったキーを貼ってください。使わないなら、空のままで大丈夫です。</p>
        <input id="keyGemini" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <button id="showKeys" class="small" type="button">キーを見えるようにする</button>
      <button id="saveKeys" class="go" type="button">キーを保存する</button>
      <div class="field">
        <h3>キーのあつかい</h3>
        <p>キーは、このiPadの中だけに保存します。会話を送るときに、そのAIの会社にだけ送ります。<br>料金は、1ドル162円で計算した目安です。</p>
      </div>
    </div>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="dlg" hidden role="dialog" aria-modal="true">
    <div class="card">
      <p id="dlgText"></p>
      <input id="dlgInput" type="text" autocomplete="off" maxlength="60">
      <textarea id="dlgArea"></textarea>
      <div class="btns">
        <button id="dlgNo" type="button">やめる</button>
        <button id="dlgYes" type="button">OK</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  const VERSION = "0.4";
  const app = document.getElementById("app");
  const list = document.getElementById("list");
  const box = document.getElementById("msg");
  const send = document.getElementById("send");
  const mirror = document.getElementById("mirror");
  const where = document.getElementById("where");
  const state = document.getElementById("state");

  /* ───────── たずねる小窓（名前を入れる、確かめる、知らせる） ───────── */
  const dlg = document.getElementById("dlg");
  const dlgText = document.getElementById("dlgText");
  const dlgInput = document.getElementById("dlgInput");
  const dlgArea = document.getElementById("dlgArea");
  const dlgYes = document.getElementById("dlgYes");
  const dlgNo = document.getElementById("dlgNo");
  let dlgDone = null;
  // input:true なら入れた文字、そうでなければ true を返す。やめたら null
  function dialog(o){
    return new Promise(resolve => {
      dlgText.textContent = o.text;
      dlgInput.hidden = !o.input;
      dlgInput.value = o.value || "";
      dlgArea.hidden = !o.area;
      dlgArea.value = o.area ? (o.value || "") : "";
      dlgYes.textContent = o.yes || "OK";
      dlgNo.textContent = o.no || "やめる";
      dlgNo.hidden = !!o.only;
      dlg.hidden = false;
      dlgDone = v => { dlg.hidden = true; dlgDone = null; resolve(v); };
      if(o.input) setTimeout(() => { dlgInput.focus(); dlgInput.select(); }, 50);
    });
  }
  dlgYes.addEventListener("click", () => {
    if(!dlgDone) return;
    if(!dlgArea.hidden){ dlgArea.blur(); dlgDone({ text:dlgArea.value }); return; }
    if(!dlgInput.hidden){
      const v = dlgInput.value.trim();
      if(!v){ dlgInput.focus(); return; }
      dlgInput.blur(); dlgDone(v);
    }else dlgDone(true);
  });
  dlgNo.addEventListener("click", () => { if(dlgDone){ dlgInput.blur(); dlgArea.blur(); dlgDone(null); } });
  const tell = text => dialog({ text:text, only:true, yes:"閉じる" });
  // 少し出て、自然に消えるお知らせ（押さなくてよい）
  const toastEl = document.getElementById("toast");
  let toastTimer = 0;
  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2600);
  }

  /* ───────── モデルの一覧（ここ1か所にまとめる） ─────────
     pin / pout は、100万トークンあたりの料金（ドル）。
     Claude は公式の料金表で 2026年11月11日に確認。Gemini は 2026年10月末の情報で、公式ページでは未確認。 */
  const RATE = 162;            // 1ドル = 162円 で計算（今のCoveの表示に合わせた）
  const SEND_COUNT = 40;       // AIに送る発言の数
  const DEFAULT_MODEL = "claude-sonnet-5-5";
  // 並びと添え書きは、Cove v19.27 と同じ。Fable 5.2 を足し、Opus 5.5 は公式の料金（$4/$20）にした。
  const MODELS = [
    { id:"claude-fable-5-2",  by:"claude", name:"Claude Fable 5.2",  pin:8,   pout:40, note:"最新・最上位" },
    { id:"claude-fable-5-1",  by:"claude", name:"Claude Fable 5.1",  pin:10,  pout:50, note:"" },
    { id:"claude-fable-5",    by:"claude", name:"Claude Fable 5",    pin:10,  pout:50, note:"" },
    { id:"claude-opus-5-5",   by:"claude", name:"Claude Opus 5.5",   pin:4,   pout:20, note:"Opus最新" },
    { id:"claude-opus-4-8",   by:"claude", name:"Claude Opus 4.8",   pin:5,   pout:25, note:"" },
    { id:"claude-opus-4-7",   by:"claude", name:"Claude Opus 4.7",   pin:5,   pout:25, note:"" },
    { id:"claude-opus-4-6",   by:"claude", name:"Claude Opus 4.6",   pin:5,   pout:25, note:"" },
    { id:"claude-opus-4-5",   by:"claude", name:"Claude Opus 4.5",   pin:5,   pout:25, note:"" },
    { id:"claude-sonnet-5-5", by:"claude", name:"Claude Sonnet 5.5", pin:2,   pout:10, note:"バランス型・最新" },
    { id:"claude-sonnet-4-6", by:"claude", name:"Claude Sonnet 4.6", pin:3,   pout:15, note:"" },
    { id:"claude-sonnet-4-5", by:"claude", name:"Claude Sonnet 4.5", pin:3,   pout:15, note:"紬の生まれた海" },
    { id:"claude-haiku-5-5",  by:"claude", name:"Claude Haiku 5.5",  pin:0.1, pout:0.5, note:"軽くて速い・最新" },
    { id:"claude-haiku-4-5-20251001", by:"claude", name:"Claude Haiku 4.5", pin:1, pout:5, note:"軽くて速い" },
    { id:"gemini-4-argon",         by:"gemini", name:"Gemini 4 Argon",        pin:2,    pout:10,   note:"Gemini最上位・12月1日に倍額・有料枠のみ" },
    { id:"gemini-3.8-flash",       by:"gemini", name:"Gemini 3.8 Flash",      pin:0.75, pout:3.75, note:"Flash最新・2027年1月に倍額" },
    { id:"gemini-3.6-flash",       by:"gemini", name:"Gemini 3.6 Flash",      pin:0.75, pout:3.75, note:"2027年1月に倍額" },
    { id:"gemini-3.1-pro-preview", by:"gemini", name:"Gemini 3.1 Pro",        pin:2,    pout:12,   note:"Pro（プレビュー版・有料枠のみ）" },
    { id:"gemini-3-flash-preview", by:"gemini", name:"Gemini 3 Flash",        pin:0.5,  pout:3,    note:"プレビュー版" },
    { id:"gemini-3.5-flash-lite",  by:"gemini", name:"Gemini 3.5 Flash-Lite", pin:0.3,  pout:2.5,  note:"軽くて安い" },
    { id:"gemini-3.1-flash-lite",  by:"gemini", name:"Gemini 3.1 Flash-Lite", pin:0.25, pout:1.5,  note:"3系で一番安い" },
    { id:"gemini-2.5-flash",       by:"gemini", name:"Gemini 2.5 Flash",      pin:0.3,  pout:2.5,  note:"新規利用は制限あり" },
    { id:"gemma-4-31b-it",         by:"gemini", name:"Gemma 4 31B",           pin:0,    pout:0,    note:"無料枠" }
  ];
  const COMPANY = { claude:"Claude", gemini:"Gemini" };
  const modelOf = id => MODELS.find(m => m.id === id) || null;
  const yen = usd => {
    const y = usd * RATE;
    return "≈¥" + (y < 10 ? y.toFixed(1) : Math.round(y).toLocaleString());
  };
  // 1往復の目安（送る文字1000トークン、返事1000トークン。今のCoveと同じ数え方）
  const perTurn = (m, turns) => yen((m.pin + m.pout) / 1000 * turns);

  /* ───────── AIの会社に送る ───────── */
  function trouble(plain, detail){ const e = new Error(plain); e.plain = plain; e.detail = detail || ""; return e; }
  function fail(status, msg, who){
    const d = status + (msg ? " " + msg : "");
    if(/credit balance/i.test(msg || "")) return trouble("APIの残高が足りないようです。\n" + who + "の管理画面で、残高を確かめてください。", d);
    if(status === 401 || status === 403) return trouble(who + "のAPIキーが正しくないようです。\n「設定」で確かめてください。", d);
    if(status === 404) return trouble("このモデルは使えなくなったようです。\n別のモデルを選んでね。", d);
    if(status === 429) return trouble("今は、使いすぎの制限にかかっています。\n少し待ってから、もう一度ためしてください。", d);
    if(status >= 500) return trouble(who + "のほうが混んでいるようです。\n少し待ってから、もう一度ためしてください。", d);
    return trouble("送った内容を、" + who + "が受け付けませんでした。", d);
  }
  async function post(url, headers, body, signal, who){
    let res;
    try{
      res = await fetch(url, { method:"POST", headers:headers, body:JSON.stringify(body), signal:signal });
    }catch(e){
      if(e && e.name === "AbortError") throw e;
      throw trouble("通信できませんでした。\n電波やWi-Fiを確かめて、もう一度ためしてください。", String(e && e.message || e));
    }
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw fail(res.status, data && data.error && data.error.message, who);
    if(!data) throw trouble("返事を読み取れませんでした。もう一度ためしてください。");
    return data;
  }
  async function askClaude(model, key, persona, turns, signal){
    const body = { model:model.id, max_tokens:4096, messages:turns.map(t => ({ role:t.role, content:t.text })) };
    if(persona.trim()) body.system = persona;
    const data = await post("https://api.anthropic.com/v1/messages", {
      "content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    }, body, signal, "Claude");
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    if(!text.trim()) throw trouble("返事が空でした。もう一度ためしてください。", "stop_reason: " + data.stop_reason);
    const u = data.usage || {};
    const usd = ((u.input_tokens || 0) * model.pin + (u.cache_creation_input_tokens || 0) * model.pin * 1.25 +
      (u.cache_read_input_tokens || 0) * model.pin * 0.1 + (u.output_tokens || 0) * model.pout) / 1e6;
    return { text:text, usd:usd, cut:data.stop_reason === "max_tokens",
      usage:{ input:(u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0), output:u.output_tokens || 0 } };
  }
  async function askGemini(model, key, persona, turns, signal){
    const body = { contents:turns.map(t => ({ role:t.role === "assistant" ? "model" : "user", parts:[{ text:t.text }] })) };
    body.safetySettings = ["HARM_CATEGORY_HARASSMENT","HARM_CATEGORY_HATE_SPEECH","HARM_CATEGORY_SEXUALLY_EXPLICIT","HARM_CATEGORY_DANGEROUS_CONTENT"]
      .map(c => ({ category:c, threshold:"BLOCK_NONE" }));   // 今のCoveと同じ設定
    body.generationConfig = { maxOutputTokens:4096 };
    if(persona.trim()) body.systemInstruction = { parts:[{ text:persona }] };
    const data = await post("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model.id) + ":generateContent", {
      "content-type":"application/json", "x-goog-api-key":key
    }, body, signal, "Gemini");
    const c = (data.candidates || [])[0];
    const text = c && c.content && c.content.parts ? c.content.parts.filter(p => !p.thought && typeof p.text === "string").map(p => p.text).join("") : "";
    if(!text.trim()){
      const why = (data.promptFeedback && data.promptFeedback.blockReason) || (c && c.finishReason) || "";
      throw trouble("Geminiが返事を出しませんでした。\n内容がGeminiの決まりに引っかかったのかもしれません。", why);
    }
    const u = data.usageMetadata || {};
    const out = (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0);
    const usd = ((u.promptTokenCount || 0) * model.pin + out * model.pout) / 1e6;
    return { text:text, usd:usd, cut:c.finishReason === "MAX_TOKENS", usage:{ input:u.promptTokenCount || 0, output:out } };
  }
  // 発言を、AIに送る形にそろえる（同じ人の発言が続いたら1つにまとめ、自分の発言から始める）
  function buildTurns(msgs){
    const turns = [];
    msgs.forEach(m => {
      const role = m.role === "ai" ? "assistant" : "user";
      const last = turns[turns.length - 1];
      if(last && last.role === role) last.text += "\n\n" + m.text;
      else turns.push({ role:role, text:m.text });
    });
    while(turns.length && turns[0].role !== "user") turns.shift();
    return turns;
  }

  /* ───────── 空の色（朝・昼・夕方・夜。いつも明るい画面） ───────── */
  const SKIES = [
    { from:5,  name:"朝",   a:"#fdf3e3", b:"#e8f3f5" },
    { from:10, name:"昼",   a:"#e3f2f8", b:"#f3f8ef" },
    { from:16, name:"夕方", a:"#fde4d3", b:"#f4e6ee" },
    { from:19, name:"夜",   a:"#e4e7f5", b:"#eef0f7" }
  ];
  function paintSky(){
    const h = new Date().getHours();
    let sky = SKIES[SKIES.length - 1];
    for(const s of SKIES){ if(h >= s.from) sky = s; }
    if(h < SKIES[0].from) sky = SKIES[SKIES.length - 1];
    const root = document.documentElement.style;
    root.setProperty("--skyA", sky.a);
    root.setProperty("--skyB", sky.b);
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", sky.a);
  }

  /* ───────── 保存の入れ物（この iPad の中だけ。IndexedDB を使う） ─────────
     部屋 → スレッド → 発言 の形。記憶などは、あとの版で入れ物を足す。
     保存の形を変えるときは SCHEMA の数字を上げて、古い形から移す。 */
  const DB_NAME = "newapp-data";
  const SCHEMA = 1;
  let db = null;

  function openDB(){
    return new Promise((resolve, reject) => {
      if(!("indexedDB" in window)){ reject(new Error("この端末では保存の仕組みが使えません")); return; }
      const req = indexedDB.open(DB_NAME, SCHEMA);
      req.onupgradeneeded = () => {
        const d = req.result;
        if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath:"key" });
        if(!d.objectStoreNames.contains("rooms")) d.createObjectStore("rooms", { keyPath:"id" });
        if(!d.objectStoreNames.contains("threads")){
          const t = d.createObjectStore("threads", { keyPath:"id" });
          t.createIndex("roomId", "roomId");
        }
        if(!d.objectStoreNames.contains("messages")){
          const m = d.createObjectStore("messages", { keyPath:"id" });
          m.createIndex("threadId", "threadId");
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("保存の入れ物を開けませんでした"));
      req.onblocked = () => reject(new Error("ほかの画面でアプリが開いたままです"));
    });
  }
  function tx(stores, mode, work){
    return new Promise((resolve, reject) => {
      const t = db.transaction(stores, mode);
      let out;
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error("保存が中断されました"));
      out = work(t);
    });
  }
  function ask(req){
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);

  let current = { roomId:null, threadId:null, roomName:"", threadName:"" };

  // はじめて開いたときだけ、部屋とスレッドを1つずつ作る
  async function prepare(){
    const meta = await ask(db.transaction("meta").objectStore("meta").get("app"));
    if(meta && meta.currentThreadId){
      const th = await ask(db.transaction("threads").objectStore("threads").get(meta.currentThreadId));
      const rm = th ? await ask(db.transaction("rooms").objectStore("rooms").get(th.roomId)) : null;
      if(th && rm){
        current = { roomId:rm.id, threadId:th.id, roomName:rm.name, threadName:th.name };
        return;
      }
    }
    const now = Date.now();
    const room = { id:newId(), name:"はじめの部屋", createdAt:now, order:0, persona:"", colors:{ me:"水色", ai:"白" } };
    const thread = { id:newId(), roomId:room.id, name:"はじめのスレッド", createdAt:now, updatedAt:now };
    await tx(["meta","rooms","threads"], "readwrite", t => {
      t.objectStore("rooms").put(room);
      t.objectStore("threads").put(thread);
      t.objectStore("meta").put({ key:"app", schema:SCHEMA, createdAt:now, currentRoomId:room.id, currentThreadId:thread.id });
    });
    current = { roomId:room.id, threadId:thread.id, roomName:room.name, threadName:thread.name };
  }
  async function loadMessages(){
    const all = await ask(db.transaction("messages").objectStore("messages").index("threadId").getAll(current.threadId));
    all.sort((a, b) => a.createdAt - b.createdAt);
    return all;
  }
  function saveMessage(m){
    return tx(["messages","threads"], "readwrite", t => {
      t.objectStore("messages").put(m);
      const ts = t.objectStore("threads");
      const g = ts.get(m.threadId);
      g.onsuccess = () => { const th = g.result; if(th){ th.updatedAt = m.createdAt; ts.put(th); } };
    });
  }
  const getAll = name => ask(db.transaction(name).objectStore(name).getAll());
  const getOne = (name, id) => ask(db.transaction(name).objectStore(name).get(id));
  const putOne = (name, v) => tx(name, "readwrite", t => { t.objectStore(name).put(v); });
  async function setCurrent(roomId, threadId){
    const meta = (await getOne("meta", "app")) || { key:"app", schema:SCHEMA, createdAt:Date.now() };
    meta.currentRoomId = roomId; meta.currentThreadId = threadId;
    await putOne("meta", meta);
  }
  // スレッドを、中の発言ごと消す（いくつでも、ひとまとめに）
  function removeThreads(ids, roomId){
    return tx(["messages","threads","rooms"], "readwrite", t => {
      const ms = t.objectStore("messages"), idx = ms.index("threadId");
      ids.forEach(id => {
        const c = idx.openKeyCursor(IDBKeyRange.only(id));
        c.onsuccess = () => { const cur = c.result; if(cur){ ms.delete(cur.primaryKey); cur.continue(); } };
        t.objectStore("threads").delete(id);
      });
      if(roomId) t.objectStore("rooms").delete(roomId);
    });
  }
  let keys = { claude:"", gemini:"" };

  function removeMessage(id){

  const two = n => (n < 10 ? "0" : "") + n;

  /* ───────── 返事をもらう ───────── */
  let waiting = null, problemNote = null;
  function clearProblem(){ if(problemNote){ problemNote.remove(); problemNote = null; } }
  function problem(text, retry, detail){
    clearProblem();
    const d = note(text);

    if(detail) d.appendChild(el("span", "detail", "くわしい内容： " + detail));
    if(retry){

  async function reply(){
    if(waiting || !db) return;
    clearProblem();
    const threadId = current.threadId, roomId = current.roomId;
    const model = modelOf(await currentModelId());
    if(!model){ problem("このモデルは使えなくなりました。\n上の「モデル」から、別のモデルを選んでね。", false); return; }
    const key = keys[model.by];
    if(!key){ problem(COMPANY[model.by] + "のAPIキーがまだ入っていません。\n上の「設定」から入れてください。", true); return; }
    const room = await getOne("rooms", roomId);
    const turns = buildTurns((await loadMessages()).slice(-SEND_COUNT));
    if(!turns.length || turns[turns.length - 1].role !== "user") return;
    const ctl = new AbortController();
    const row = el("div", "row ai");
    row.appendChild(el("div", "msg wait", "返事を待っています…"));
    const u = el("div", "under");
    const stop = el("button", "", "止める");

  /* ───────── 部屋とスレッド ───────── */

  async function drawRooms(){
    const rooms = (await getAll("rooms")).sort((a, b) => a.createdAt - b.createdAt);
    const threads = (await getAll("threads")).sort((a, b) => b.updatedAt - a.updatedAt);

      }));
      head.appendChild(btn("small", "キャラ設定", async () => {
        const r = await dialog({ text:"「" + room.name + "」のキャラ設定\nここに書いたことを、毎回AIに伝えます。", area:true, value:room.persona || "", yes:"保存する" });
        if(!r) return;
        room.persona = r.text; await putOne("rooms", room);
        toast("キャラ設定を保存しました");
      }));
      head.appendChild(btn("small danger", "部屋を削除", async () => {
        if(rooms.length < 2){ await tell("部屋が1つだけのときは、削除できません。\n先に、別の部屋を作ってください。"); return; }
        const ok = await dialog({ text:"「" + room.name + "」を削除しますか？\n中のスレッド " + mine.length + "個と、その会話がすべて消えます。元に戻せません。", yes:"削除する" });
        if(!ok) return;
        await removeThreads(mine.map(t => t.id), room.id);
        if(current.roomId === room.id){
          const other = rooms.find(r => r.id !== room.id);
          let th = threads.find(t => t.roomId === other.id);
          if(!th) th = await makeThread(other, "スレッド 1");
          current = { roomId:other.id, threadId:th.id, roomName:other.name, threadName:th.name };
          await setCurrent(other.id, th.id);
          await openCurrent();
        }
        await drawRooms();
      }));
      card.appendChild(head);
      mine.forEach(th => {
        const row = el("div", "thread");
        const now = th.id === current.threadId;
        const open = btn("topen" + (now ? " now" : ""), th.name, () => goThread(th, room));
        open.appendChild(el("small", "", (now ? "いま開いている ・ " : "") + "さいごに話した日 " + when(th.updatedAt)));
        row.appendChild(open);
        row.appendChild(btn("small", "名前を変える", async () => {
          const v = await dialog({ text:"スレッドの名前", input:true, value:th.name, yes:"変える" });
          if(!v) return;
          th.name = v; await putOne("threads", th);
          if(now){ current.threadName = v; where.textContent = current.roomName + " ／ " + current.threadName; }
          await drawRooms();
        }));
        row.appendChild(btn("small danger", "削除", async () => {
          if(mine.length < 2){ await tell("部屋の中のスレッドが1つだけのときは、削除できません。\n先に、別のスレッドを作ってください。"); return; }
          const ok = await dialog({ text:"スレッド「" + th.name + "」を削除しますか？\n中の会話がすべて消えます。元に戻せません。", yes:"削除する" });
          if(!ok) return;
          await removeThreads([th.id], null);
          if(now){
            const other = mine.find(t => t.id !== th.id);
            current = { roomId:room.id, threadId:other.id, roomName:room.name, threadName:other.name };
            await setCurrent(room.id, other.id);
            await openCurrent();
          }
          await drawRooms();
        }));
        card.appendChild(row);
      });
      card.appendChild(btn("add", "＋ この部屋にスレッドを作る", async () => {
        const v = await dialog({ text:"新しいスレッドの名前", input:true, value:"スレッド " + (mine.length + 1), yes:"作る" });
        if(!v) return;
        const th = await makeThread(room, v);
        await goThread(th, room);
      }));
      roomList.appendChild(card);
    });
    roomList.appendChild(btn("add", "＋ 部屋を作る", async () => {
      const v = await dialog({ text:"新しい部屋の名前", input:true, value:"", yes:"作る" });
      if(!v) return;
      const now = Date.now();
      const room = { id:newId(), name:v, createdAt:now, order:rooms.length, persona:"", colors:{ me:"水色", ai:"白" } };
      await putOne("rooms", room);
      const th = await makeThread(room, "スレッド 1");
      await goThread(th, room);
    }));
  }
  document.getElementById("openRooms").addEventListener("click", async () => {
    if(!db) return;
    box.blur();
    try{ await drawRooms(); panel.hidden = false; }
    catch(e){ tell("部屋の一覧を開けませんでした。もう一度ためしてください。"); }
  });
  document.getElementById("closeRooms").addEventListener("click", () => { panel.hidden = true; });

  /* ───────── 画面の土台（揺れの試し（3）と同じ作り） ───────── */
  let lastH = -1, lastT = "";
  function fit(){
    const vv = window.visualViewport;
    if(window.scrollY !== 0 || (vv && vv.offsetTop > 0.5)){
      moved++;
      window.scrollTo(0, 0);
    }
    const h = Math.round(vv ? vv.height : window.innerHeight);
    const off = vv ? vv.offsetTop : 0;
    // キーボードが出入りしたときは、いちばん下からの距離を保つ
    if(h !== lastH){
      const gap = list.scrollHeight - list.scrollTop - list.clientHeight;
      lastH = h;
      app.style.height = h + "px";
      list.scrollTop = list.scrollHeight - list.clientHeight - gap;
    }
    const t = off > 0.5 ? "translateY(" + off + "px)" : "";
    if(t !== lastT){ lastT = t; app.style.transform = t; }
    showState();
  }
  if(window.visualViewport){
    visualViewport.addEventListener("resize", fit);
    visualViewport.addEventListener("scroll", fit);
  }
  window.addEventListener("resize", fit);
  window.addEventListener("scroll", fit, { passive:true });
  fit();

  // 入力欄は縮めずに、見えない写しで高さを測る。伸びても会話は動かさない
  let boxH = 0;
  function grow(){
    mirror.style.width = box.offsetWidth + "px";
    mirror.textContent = box.value + "\u200b";
    const h = Math.max(51, Math.min(Math.ceil(mirror.offsetHeight), 160));
    if(h !== boxH){ boxH = h; box.style.height = h + "px"; }
  }
  box.addEventListener("input", () => { grow(); fit(); requestAnimationFrame(fit); });
  box.addEventListener("focus", () => { setTimeout(fit, 60); setTimeout(fit, 350); });
  window.addEventListener("resize", grow);
  grow();

  /* ───────── 送る ───────── */
  let busy = false;
  async function submit(){
    const text = box.value.replace(/\s+$/, "");
    if(!text.trim() || busy || waiting || !db) return;
    busy = true;
    const m = { id:newId(), threadId:current.threadId, roomId:current.roomId, role:"me", text:text, createdAt:Date.now() };
    try{
      await saveMessage(m);          // 先に保存してから、画面に出す
      count++; showHint();
      draw(m);
      box.value = "";
      grow();
      toBottom();
      showState();
      busy = false;
      reply();
      return;
    }catch(e){
      tell("保存できませんでした。文字は入力欄に残してあります。もう一度「送る」を押してください。");
    }
    busy = false;
  }
  send.addEventListener("click", () => { submit(); box.focus(); });

  /* ───────── はじまり ───────── */
  (async function start(){
    try{
      db = await openDB();
      db.onversionchange = () => { db.close(); };
      await prepare();
      await loadSettings();
      await openCurrent();
      // 「勝手に消さないで」とiPadにお願いする（聞き入れられたかを表示する）
      if(navigator.storage && navigator.storage.persist){
        let ok = false;
        try{ ok = await navigator.storage.persisted() || await navigator.storage.persist(); }catch(e){}
        keep = ok ? "消えにくい設定" : "ふつうの設定";
      }else{ keep = "ふつうの設定"; }
      showState();
    }catch(e){
      where.textContent = "保存の入れ物を開けませんでした";
      note("保存の入れ物を開けませんでした。このままでは文字が残りません。\n画面の写真を撮って、Claudeに見せてください。\n（" + (e && e.message ? e.message : "理由は分かりません") + "）").style.whiteSpace = "pre-line";
      send.disabled = true;
    }
  })();
})();
</script>
</body>
</html>
