<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Book</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="theme-color" content="#22362d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --cloth:#22362d; --cloth-2:#2c4539; --gilt:#d9c9a3;
  --page:#fbfaf6; --wash:#efede6; --line:#d8d5ca;
  --ink:#1f1d1a; --soft:#6c7269; --warn:#8a3b2e;
  --display:"Didot","Bodoni 72","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --text:"Baskerville","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --ui:-apple-system,"Hiragino Sans","Noto Sans CJK JP",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--cloth);outline-offset:2px}
.hidden{display:none!important}

/* 表紙（ヘッダー） */
.cover{background:var(--cloth);color:var(--gilt);padding:calc(env(safe-area-inset-top) + 28px) max(24px,env(safe-area-inset-left)) 30px}
.cover-in{max-width:1080px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cover h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.1;margin:0;letter-spacing:.01em}
.cover p{margin:8px 0 0;font-style:italic;font-size:15px;opacity:.8}
.cover-actions{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--cloth);background:var(--cloth);color:#fff;padding:10px 20px;border-radius:2px;font-family:var(--text);font-size:16px;line-height:1.3}
.btn.gilt{background:var(--gilt);border-color:var(--gilt);color:var(--cloth)}
.btn.quiet{background:transparent;color:var(--cloth)}
.cover .btn.quiet{color:var(--gilt);border-color:rgba(217,201,163,.5)}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45}
.linkish{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;text-underline-offset:3px;font-size:15px}

main{max-width:1080px;margin:0 auto;padding:24px max(24px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 80px)}

/* 読み取りの状況 */
.queue{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--wash);border:0;border-left:3px solid var(--cloth);padding:10px 16px;margin:0 0 20px;font-size:15px;line-height:1.5}
.queue.stop{border-left-color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cloth);flex:none}
.dot.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

/* 探す */
.find{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:6px}
.find input{flex:1;border:0;background:none;font-size:20px;padding:6px 0;outline:none;min-width:0}
.find input::placeholder{color:#a9aba3}
.tabs{display:flex;gap:22px;overflow-x:auto;margin:18px 0 6px;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:4px 0;white-space:nowrap;font-size:16px;color:var(--soft);border-bottom:1px solid transparent}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;font-size:14.5px;color:var(--soft)}
.chips button{background:none;border:0;padding:2px 0;color:inherit}
.chips button:hover{color:var(--ink)}
.count{color:var(--soft);font-size:14.5px;margin:22px 0 14px}

/* 一覧 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:34px 26px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:44px 34px}}
.card{display:block;text-align:left;background:none;border:0;padding:0;color:inherit}
.plate{aspect-ratio:4/5;background:var(--wash);overflow:hidden;display:flex;align-items:center;justify-content:center}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.plate .initial{font-family:var(--display);font-size:84px;line-height:1;color:#c3c1b6}
.tone .plate img,.tone .hero img{filter:saturate(.86) contrast(.97) brightness(1.02) sepia(.05)}
.card h3{font-family:var(--text);font-weight:400;font-size:17px;line-height:1.5;margin:12px 0 0}
.card small{color:var(--soft);font-size:13.5px}
.empty{padding:60px 0;text-align:center;color:var(--soft)}
.empty p{max-width:30em;margin:0 auto 18px}

/* レシピのページ */
.back{margin:0 0 18px}
.spread{display:grid;gap:30px}
@media (min-width:860px){.spread.has-photo{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;align-items:start}
  .spread.has-photo .hero{position:sticky;top:24px}}
.hero img{width:100%;display:block;max-height:82vh;object-fit:cover}
.recipe h2{font-family:var(--text);font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.4;margin:0 0 6px}
.meta{color:var(--soft);font-size:15px;margin:0 0 26px;overflow-wrap:anywhere}
.meta a{color:inherit}
.recipe h4{font-family:var(--text);font-weight:400;font-size:19px;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.recipe h4 i{font-family:var(--display);font-size:15px;color:var(--soft)}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.ings li::after{content:"";order:2;flex:1;border-bottom:1px dotted #b9b7ac;transform:translateY(-5px);min-width:16px}
.ings .n{order:1}.ings .a{order:3;color:var(--soft);text-align:right;max-width:55%}
.ings li.group{padding-top:14px;color:var(--soft);font-size:15px}
.ings li.group::after{display:none}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;padding:8px 0}
.steps li::before{content:counter(s);font-family:var(--display);font-size:30px;line-height:1.15;color:var(--cloth)}
.memo{white-space:pre-wrap;color:#45423d}
details.orig{margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
details.orig summary{color:var(--soft);font-size:15px;cursor:pointer}
.origs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.origs img{width:100%;display:block;border:1px solid var(--line)}
.rawtext{white-space:pre-wrap;font-family:var(--ui);font-size:14px;line-height:1.7;color:#55524c;background:var(--wash);padding:14px;margin-top:14px}

.video{margin:0 0 14px}
.video .frame{position:relative;aspect-ratio:16/9;background:#000;margin-bottom:4px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video a{font-size:14.5px;color:var(--soft)}

/* 入力 */
.form{max-width:680px}
.form h2,.sheet h2{font-family:var(--text);font-weight:400;font-size:24px;margin:0 0 18px}
label.f{display:block;margin:0 0 18px;font-size:14.5px;color:var(--soft)}
label.f>input,label.f>select,label.f>textarea,.rows input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:#fff;border-radius:2px;padding:10px 12px;font-family:var(--ui);font-size:16px;line-height:1.6;color:var(--ink)}
textarea{resize:vertical}
.rows{margin:4px 0 18px}
.rows .row{display:grid;grid-template-columns:3fr 2fr 40px;gap:8px;margin-bottom:8px}
.rows .row button{border:1px solid var(--line);background:#fff;border-radius:2px;color:var(--soft)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.bar .sp{flex:1}
.hint{font-size:14px;color:var(--soft);line-height:1.7;margin:6px 0 0}
.section{border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
.section h3{font-family:var(--text);font-weight:400;font-size:19px;margin:0 0 12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;margin:10px 0;line-height:1.6}
.check input{margin-top:6px;width:18px;height:18px;accent-color:var(--cloth)}

dialog{border:0;padding:0;background:var(--page);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border-radius:3px;box-shadow:0 20px 60px rgba(20,30,25,.35)}
dialog::backdrop{background:rgba(24,34,29,.55)}
.sheet{padding:26px 26px 22px}
.pick{display:block;border:1px dashed var(--soft);padding:18px;text-align:center;border-radius:2px;margin-bottom:12px;color:var(--cloth)}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;flex-wrap:wrap;gap:12px 8px;margin-bottom:14px;align-items:flex-start}
.thumbs .th{display:flex;flex-direction:column;align-items:center;gap:3px;width:96px}
.thumbs .th.cut{margin-left:10px;padding-left:10px;border-left:2px solid var(--cloth);width:108px}
.thumbs .pic{position:relative}
.thumbs .pg{font-size:12px;color:var(--soft);line-height:1.2}
.thumbs .cutbtn{border:1px solid var(--line);background:#fff;border-radius:2px;font-size:11px;line-height:1.3;padding:4px 2px;width:96px;color:var(--soft);font-family:var(--ui)}
.thumbs .cutbtn[aria-pressed=true]{background:var(--cloth);border-color:var(--cloth);color:#fff}
.thumbs img{width:96px;height:128px;object-fit:cover;display:block;border:1px solid var(--line)}
.thumbs button.x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:1}
.thumbs button.choose{border:0;padding:0;background:none}
.jobs{list-style:none;margin:0;padding:0}
.jobs li{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6}
.jobs img,.jobs .noimg{width:48px;height:64px;object-fit:cover;background:var(--wash)}
.jobs .err{color:var(--warn)}
.cropwrap{display:flex;justify-content:center;background:var(--wash);padding:14px;touch-action:none}
.cropwrap canvas{width:min(100%,320px);aspect-ratio:4/5;cursor:grab;touch-action:none}
input[type=range]{width:100%;accent-color:var(--cloth)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:2px;font-size:15px;max-width:calc(100vw - 32px);z-index:50;transition:opacity .25s;opacity:0;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="cover"><div class="cover-in">
  <div><h1 id="bookTitle"></h1><p id="bookSub"></p></div>
  <div class="cover-actions">
    <button class="btn quiet" id="btnSettings">設定</button>
    <button class="btn gilt" id="btnAdd">レシピを足す</button>
  </div>
</div></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
const VERSION='2026-11-16 c（PDF）'; // 直すたびにここを書きかえる
/* ================= 基本の道具 ================= */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,a,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(a||{})){
    if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false)continue; e.append(c.nodeType?c:String(c)); }
  return e;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let toastT;
function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= 設定（この端末に保存） ================= */
const DEFAULT_CATS=['お菓子','パン','主菜','副菜','汁もの','ごはん・麺','飲みもの','その他'];
const DEFAULT_SYN=`卵、たまご、玉子、タマゴ、全卵
生クリーム、ホイップ、ホイップクリーム、クリーム、フレッシュクリーム
薄力粉、小麦粉、フラワー
強力粉、パン用粉、小麦粉
砂糖、上白糖、グラニュー糖、きび砂糖、てんさい糖、シュガー
粉砂糖、粉糖、パウダーシュガー
バター、無塩バター、有塩バター、発酵バター
牛乳、ミルク
チョコレート、チョコ、ショコラ、クーベルチュール
ココア、ココアパウダー、カカオパウダー
ベーキングパウダー、BP、ふくらし粉
イースト、ドライイースト、酵母
片栗粉、コーンスターチ
はちみつ、蜂蜜、ハチミツ、ハニー
じゃがいも、ジャガイモ、じゃが芋、馬鈴薯、ポテト
さつまいも、サツマイモ、さつま芋、薩摩芋
玉ねぎ、たまねぎ、玉葱、タマネギ、オニオン
長ねぎ、長ネギ、ねぎ、ネギ、葱、白ねぎ
にんじん、人参、ニンジン、キャロット
ピーマン、パプリカ
なす、茄子、ナス、なすび
かぼちゃ、南瓜、カボチャ、パンプキン
ほうれん草、ほうれんそう、ホウレンソウ
きのこ、キノコ、茸、しめじ、まいたけ、えのき、エリンギ、マッシュルーム
しいたけ、椎茸、シイタケ
にんにく、ニンニク、大蒜、ガーリック
しょうが、生姜、ショウガ、ジンジャー
大葉、しそ、紫蘇、青じそ
鶏肉、とり肉、鳥肉、チキン、鶏もも、鶏むね、ささみ
豚肉、ぶた肉、ポーク、豚バラ、豚こま
牛肉、ビーフ
ひき肉、挽き肉、挽肉、ミンチ
えび、海老、エビ、シュリンプ
鮭、さけ、サーモン、しゃけ
豆腐、とうふ
醤油、しょうゆ、しょう油
味噌、みそ
酢、お酢、ビネガー
ごま、胡麻、ゴマ
ごま油、胡麻油、ゴマ油
レモン、檸檬
りんご、林檎、リンゴ、アップル
いちご、苺、イチゴ、ストロベリー
ヨーグルト、プレーンヨーグルト
チーズ、クリームチーズ、粉チーズ、ピザ用チーズ
ごはん、ご飯、米、お米、ライス
パスタ、スパゲティ、スパゲッティ`;
const LS='recipebook.';
const S={
  get key(){return localStorage.getItem(LS+'key')||''}, set key(v){localStorage.setItem(LS+'key',v.trim())},
  get model(){return localStorage.getItem(LS+'model')||''}, set model(v){localStorage.setItem(LS+'model',v)},
  get autoModel(){return localStorage.getItem(LS+'autoModel')||''}, set autoModel(v){localStorage.setItem(LS+'autoModel',v)},
  get cats(){try{const c=JSON.parse(localStorage.getItem(LS+'cats'));if(Array.isArray(c)&&c.length)return c;}catch(e){}return DEFAULT_CATS.slice()},
  set cats(v){localStorage.setItem(LS+'cats',JSON.stringify(v))},
  get syn(){const v=localStorage.getItem(LS+'syn');return v==null?DEFAULT_SYN:v}, set syn(v){localStorage.setItem(LS+'syn',v);synCache=null},
  get title(){return localStorage.getItem(LS+'title')||"Nokka's Recipes"}, set title(v){localStorage.setItem(LS+'title',v)},
  get tone(){return localStorage.getItem(LS+'tone')!=='0'}, set tone(v){localStorage.setItem(LS+'tone',v?'1':'0')},
  get lastBackup(){return +localStorage.getItem(LS+'lastBackup')||0}, set lastBackup(v){localStorage.setItem(LS+'lastBackup',v)},
};

/* ================= 保存場所（IndexedDB） ================= */
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('recipebook',1);
  r.onupgradeneeded=()=>{const d=r.result;for(const s of ['recipes','images','jobs'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(store,mode); let out; const rq=fn(t.objectStore(store));
  if(rq)rq.onsuccess=()=>{out=rq.result};
  t.oncomplete=()=>res(out); t.onerror=t.onabort=()=>rej(t.error||new Error('保存に失敗しました'));
});}
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
async function putImage(id,blob){await dbPut('images',{id,type:blob.type||'image/jpeg',buf:await blob.arrayBuffer()});}
async function getImage(id){const r=await dbGet('images',id);return r?new Blob([r.buf],{type:r.type}):null;}

/* ================= 画像の道具 ================= */
function loadImg(blob){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);res(im)}; im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('この画像は開けませんでした'))}; im.src=url;
});}
function drawTo(im,sx,sy,sw,sh,maxSide){
  const k=Math.min(1,maxSide/Math.max(sw,sh)); const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*k)); c.height=Math.max(1,Math.round(sh*k));
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height); return c;
}
const toBlob=(c,q=.85)=>new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
function readAs(blob,how){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(f.error);f[how](blob);});}
const toB64=async blob=>(await readAs(blob,'readAsDataURL')).split(',')[1];
async function shrink(file){const im=await loadImg(file);return toBlob(drawTo(im,0,0,im.naturalWidth,im.naturalHeight,1600),.85);}

/* ================= ことばの幅（検索） ================= */
const norm=s=>(s||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'');
let synCache=null;
function synGroups(){ if(!synCache)synCache=S.syn.split('\n').map(l=>l.split(/[、,，]/).map(norm).filter(Boolean)).filter(g=>g.length>1); return synCache; }
function variants(term){const out=new Set([term]);for(const g of synGroups())if(g.includes(term))g.forEach(w=>out.add(w));return [...out];}
function indexOf(r){return norm([r.title,r.category,r.servings,r.memo,r.source,(r.ingredients||[]).map(i=>i.name).join(' '),(r.steps||[]).join(' '),(r.words||[]).join(' ')].join(' '));}
function matches(r,q){const terms=q.normalize('NFKC').split(/\s+/).map(norm).filter(Boolean);return terms.every(t=>variants(t).some(v=>r._ix.includes(v)));}
const cleanIng=n=>(n||'').replace(/[（(［\[].*?[)）］\]]/g,'').replace(/^[★☆◎●○■□▲△◆◇・*\-\s]+/,'').replace(/^[A-ZＡ-Ｚa-z][\s　:：.．]+/,'').trim();

/* ================= QRコード（動画のリンク） ================= */
const JSQR_URL='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
let jsqrP=null;
function loadJsQR(){
  if(window.jsQR)return Promise.resolve();
  if(!jsqrP)jsqrP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=JSQR_URL;s.onload=()=>res();
    s.onerror=()=>{jsqrP=null;s.remove();rej(new Error('QRコードを読む部品を取ってこられませんでした。電波のよいところでもう一度試してください。'))};document.head.append(s);});
  return jsqrP;
}
// 画像の中のQRコードを全部さがして、リンク（http…）だけを返す。
// 大きめの画像で「全体→9つの部分」、次に小さめの画像で全体、の順に見る（大きさによって読めたり読めなかったりするので2通り試す）。
// 見つけたQRは白く塗って、同じ画像の次のQRをさがす。
async function scanQR(blob){
  await loadJsQR();
  const im=await loadImg(blob); const W=im.naturalWidth,H=im.naturalHeight; const found=[];
  const k1=Math.min(1,3000/Math.max(W,H));
  for(const [k,tiles] of [[k1,true],[k1*.62,false]]){
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(W*k)); c.height=Math.max(1,Math.round(H*k));
    const g=c.getContext('2d',{willReadFrequently:true}); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
    const tw=Math.ceil(c.width/2),th=Math.ceil(c.height/2); const areas=[[0,0,c.width,c.height]];
    if(tiles)for(let y=0;y<3;y++)for(let x=0;x<3;x++)areas.push([Math.floor(x*(c.width-tw)/2),Math.floor(y*(c.height-th)/2),tw,th]);
    for(const [ax,ay,aw,ah] of areas){
      for(let n=0;n<8;n++){
        const d=g.getImageData(ax,ay,aw,ah); const r=window.jsQR(d.data,aw,ah,{inversionAttempts:'dontInvert'}); if(!r)break;
        const p=r.location,pts=[p.topLeftCorner,p.topRightCorner,p.bottomRightCorner,p.bottomLeftCorner];
        const x0=Math.min(...pts.map(q=>q.x)),x1=Math.max(...pts.map(q=>q.x)),y0=Math.min(...pts.map(q=>q.y)),y1=Math.max(...pts.map(q=>q.y)),pad=(x1-x0)*.12+4;
        g.fillRect(ax+x0-pad,ay+y0-pad,x1-x0+pad*2,y1-y0+pad*2);
        const t=(r.data||'').trim(); if(t&&!found.includes(t))found.push(t);
      }
      await sleep(0);
    }
    c.width=c.height=1;
  }
  return found.filter(t=>/^https?:\/\//i.test(t));
}
// YouTube / Vimeo のリンクを、ページの中で再生できる形にする。できないリンクは null。
function videoEmbed(u){
  let m;
  if((m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/))([\w-]{11})/)))return 'https://www.youtube-nocookie.com/embed/'+m[1];
  if((m=u.match(/vimeo\.com\/(?:video\/|channels\/[^\/]+\/|groups\/[^\/]+\/videos\/|manage\/videos\/)?(\d{6,})(?:\/([0-9a-f]{6,})|[^#]*?[?&]h=([0-9a-f]+))?/)))return 'https://player.vimeo.com/video/'+m[1]+((m[2]||m[3])?'?h='+(m[2]||m[3]):'');
  return null;
}
function videoBlock(r){
  const vids=r.videos||[];
  if(!vids.length)return r.imageIds&&r.imageIds.length?h('p',{class:'video'},h('button',{class:'linkish',onclick:e=>findVideos(r,e.target)},'元の画像からQRコードの動画をさがす')):null;
  return [h('h4',{},'動画',h('i',{},'Video')),vids.map(u=>{const e=videoEmbed(u);return h('div',{class:'video'},
    e?h('div',{class:'frame'},h('iframe',{src:e,loading:'lazy',title:'動画',allow:'fullscreen; picture-in-picture; encrypted-media',allowfullscreen:true,referrerpolicy:'strict-origin-when-cross-origin'})):null,
    h('a',{href:u,target:'_blank',rel:'noopener'},e?'ここで映らないときは、こちらからひらく':'動画をひらく'));})];
}
async function findVideos(r,btn){
  const label=btn.textContent; btn.disabled=true; btn.textContent='さがしています…';
  try{
    const out=[...(r.videos||[])]; const before=out.length;
    for(const iid of r.imageIds||[]){const b=await getImage(iid); if(b)for(const u of await scanQR(b))if(!out.includes(u))out.push(u);}
    if(out.length>before){r.videos=out;r.updatedAt=Date.now();await saveRecipe(r);toast('動画のリンクを見つけました');if(route().name==='r')render();return;}
    toast('QRコードは見つかりませんでした');
  }catch(e){toast(e.message,5000);}
  btn.disabled=false; btn.textContent=label;
}

/* ================= Gemini（文字の読み取り） ================= */
const API='https://generativelanguage.googleapis.com/v1beta';
class GErr extends Error{constructor(kind,msg,wait){super(msg);this.kind=kind;this.wait=wait;}}
function schema(){return {type:'OBJECT',properties:{
  is_recipe:{type:'BOOLEAN'}, title:{type:'STRING'}, category:{type:'STRING',enum:S.cats}, servings:{type:'STRING'},
  ingredients:{type:'ARRAY',items:{type:'OBJECT',properties:{name:{type:'STRING'},amount:{type:'STRING'}},required:['name']}},
  steps:{type:'ARRAY',items:{type:'STRING'}}, memo:{type:'STRING'}, source:{type:'STRING'},
  search_words:{type:'ARRAY',items:{type:'STRING'}},
  photo:{type:'OBJECT',properties:{image_index:{type:'INTEGER'},box_2d:{type:'ARRAY',items:{type:'INTEGER'}}}}
},required:['is_recipe','title','category','ingredients','steps']};}
function prompt(nImg,hasText){return `あなたはレシピを書き写す係です。${nImg?`画像が${nImg}枚`:''}${nImg&&hasText?'と、':''}${hasText?'貼り付けられた文章が':''}あります。全部あわせて「ひとつのレシピ」として、次のJSONにまとめてください。

大事な決まり:
- 書いてある内容を忠実に書き写す。書かれていない材料・分量・手順を想像で足さない。
- 縦書き、横書き、手書き風の文字、飾り文字、写真の上に重なった文字も読む。どうしても読めない文字は「□」にする。
- インスタなどのスクショの場合、いいね数・コメント・ボタン・広告・ハッシュタグの羅列・「保存してね」のような呼びかけは無視する。
- 文字は日本語のまま。分量の表記（大さじ1、100g など）は元のまま。

各項目:
- is_recipe: 材料か作り方が少しでも読み取れたら true。
- title: 料理名。書かれていなければ内容から短く付ける。
- category: 次の中からいちばん近いものをひとつ: ${S.cats.join(' / ')}
- servings: 「2人分」「18cm型1台」など。なければ空文字。
- ingredients: 材料ごとに name と amount。「A」「生地」「ソース」のようなまとまりの見出しは、name を「【生地】」のように【】で囲み amount は空にして、その位置に入れる。
- steps: 作り方を1手順ずつ。先頭の番号は付けない。
- memo: コツ、ポイント、保存方法、焼き時間の補足など。なければ空文字。
- source: 投稿者のアカウント名やサイト名が分かれば。なければ空文字。
- search_words: あとで検索しやすくするための言葉。主な材料それぞれについて、ひらがな・カタカナ・漢字の書き方と、よく使われる別の呼び方を入れる（例: 卵→たまご, 玉子 ／ 生クリーム→ホイップクリーム）。料理の種類を表す言葉（例: クッキー, 焼き菓子, 煮物）も入れる。20語まで。
- photo: できあがった料理の写真が写っている画像があれば、その番号 image_index（最初の画像が0）と、写真部分の範囲 box_2d を [ymin, xmin, ymax, xmax]（画像全体を0〜1000とした値）で。文字やボタンがなるべく入らない範囲にする。料理の写真がなければ image_index を -1 にする。`;}

let modelList=null; const badModels=new Set();
async function fetchModels(){
  const res=await fetch(API+'/models?pageSize=200',{headers:{'x-goog-api-key':S.key}}).catch(()=>{throw new GErr('retry','通信できませんでした')});
  const j=await res.json().catch(()=>null);
  if(!res.ok)throw classify(res.status,j);
  const out=[];
  for(const m of j.models||[]){
    const id=(m.name||'').replace(/^models\//,'');
    if(!(m.supportedGenerationMethods||[]).includes('generateContent'))continue;
    const mm=id.match(/^gemini-(\d+(?:\.\d+)?)-flash(-lite)?(.*)$/); if(!mm)continue;
    if(/image|tts|audio|live|embed|robot|computer|omni|thinking|exp/.test(mm[3]))continue;
    out.push({id,score:(mm[3]===''?1000:0)+(mm[2]?0:500)+parseFloat(mm[1])*10});
  }
  out.sort((a,b)=>b.score-a.score); modelList=out.map(o=>o.id); return modelList;
}
async function currentModel(){
  if(S.model)return S.model;
  if(S.autoModel&&!badModels.has(S.autoModel))return S.autoModel;
  if(!modelList)await fetchModels();
  const m=modelList.find(x=>!badModels.has(x));
  if(!m)throw new GErr('fatal','無料で使えるGeminiのモデルが見つかりませんでした。設定の「読み取りに使うモデル」を確かめてください。');
  S.autoModel=m; return m;
}
function classify(status,j){
  const er=(j&&j.error)||{}; const msg=er.message||('エラー '+status);
  if(status===429){
    if(/limit:\s*0\b/.test(msg))return new GErr('model',msg);
    if(/per\s*day|perday|daily/i.test(msg+JSON.stringify(er.details||'')))return new GErr('day',msg);
    let wait=20; const d=(er.details||[]).find(x=>x.retryDelay); const m=msg.match(/retry in ([\d.]+)s/i);
    if(d)wait=parseFloat(d.retryDelay)||wait; else if(m)wait=parseFloat(m[1]);
    return new GErr('wait',msg,Math.min(120,Math.ceil(wait)+2));
  }
  if(status===404)return new GErr('model',msg);
  if(status===401||status===403||(status===400&&/api key/i.test(msg)))return new GErr('key',msg);
  if(status===400)return new GErr('schema',msg);
  return new GErr('retry',msg);
}
async function askGemini(parts,noSchema){
  const model=await currentModel();
  const gen={temperature:0.1,responseMimeType:'application/json'}; if(!noSchema)gen.responseSchema=schema();
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),150000); let res;
  try{res=await fetch(`${API}/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:gen}),signal:ctl.signal});}
  catch(e){throw new GErr('retry',ctl.signal.aborted?'時間がかかりすぎました':'通信できませんでした');}
  finally{clearTimeout(to);}
  const j=await res.json().catch(()=>null);
  if(!res.ok){const e=classify(res.status,j); if(e.kind==='model'){ if(S.model===model)throw new GErr('fatal','設定で選んだモデル（'+model+'）が使えませんでした。設定で「おまかせ」に戻してみてください。'); badModels.add(model); if(S.autoModel===model)S.autoModel='';} throw e;}
  const c=j&&j.candidates&&j.candidates[0];
  const text=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
  if(!text)throw new GErr('retry','返事が空でした');
  try{const s=text.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim(); const a=s.indexOf('{'),b=s.lastIndexOf('}'); return JSON.parse(s.slice(a,b+1));}
  catch(e){throw new GErr('retry','返事の形が崩れていました');}
}

/* ================= 読み取りの順番待ち ================= */
let R=[];              // 保存済みレシピ（メモリ上）
let jobsCache=[]; let workingId=null; let paused=null; let pumping=false; let pumpTimer=null;
const BACKOFF=[6,15,30,60,120];
async function refreshJobs(){jobsCache=(await dbAll('jobs')).sort((a,b)=>a.createdAt-b.createdAt);renderQueue();}
async function pump(){
  if(pumping)return; pumping=true; clearTimeout(pumpTimer);
  try{
    for(;;){
      await refreshJobs();
      if(paused)break;
      const pend=jobsCache.filter(j=>j.status==='pending'); if(!pend.length)break;
      if(!S.key){paused='key';break;}
      const now=Date.now(); const job=pend.find(j=>(j.nextAt||0)<=now);
      if(!job){pumpTimer=setTimeout(pump,Math.max(500,Math.min(...pend.map(j=>j.nextAt))-now+100));break;}
      workingId=job.id; renderQueue();
      try{await runJob(job);}
      catch(e){
        const k=e.kind||'retry';
        if(k==='key'){paused='key';}
        else if(k==='day'){paused='day';}
        else if(k==='model'){/* 別のモデルでそのまま続ける */}
        else if(k==='schema'&&!job.noSchema){job.noSchema=true;await dbPut('jobs',job);}
        else if(k==='wait'||k==='retry'){
          job.tries=(job.tries||0)+1;
          if(job.tries>BACKOFF.length){job.status='error';job.error='何度か試しましたが読み取れませんでした（'+e.message+'）';}
          else job.nextAt=Date.now()+1000*(e.wait||BACKOFF[job.tries-1]);
          await dbPut('jobs',job);
        }else{job.status='error';job.error=k==='norecipe'?'レシピらしい文字が見つかりませんでした':(e.message||'読み取れませんでした');if(k==='norecipe')job.keepable=true;await dbPut('jobs',job);}
      }
      workingId=null;
    }
  }finally{workingId=null;pumping=false;await refreshJobs();}
}
async function runJob(job){
  const blobs=[]; for(const id of job.imageIds){const b=await getImage(id); if(b)blobs.push(b);}
  const parts=[{text:prompt(blobs.length,!!job.text)+(job.noSchema?'\n\nJSONだけを返してください。キーは is_recipe, title, category, servings, ingredients[{name,amount}], steps[], memo, source, search_words[], photo{image_index, box_2d} です。':'')}];
  if(job.text)parts.push({text:'--- 貼り付けられた文章 ---\n'+job.text});
  for(const b of blobs)parts.push({inline_data:{mime_type:'image/jpeg',data:await toB64(b)}});
  const r=await askGemini(parts,job.noSchema);
  const ings=(r.ingredients||[]).filter(i=>i&&i.name).map(i=>({name:String(i.name).trim(),amount:String(i.amount||'').trim()}));
  const steps=(r.steps||[]).map(s=>String(s).replace(/^\s*[\d０-９]+[.．、)）]\s*/,'').trim()).filter(Boolean);
  if(!ings.length&&!steps.length)throw new GErr('norecipe','');
  const cats=S.cats;
  const rec={id:job.id,title:(r.title||'').trim()||'名前のないレシピ',category:cats.includes(r.category)?r.category:cats[cats.length-1],
    servings:(r.servings||'').trim(),ingredients:ings,steps,memo:(r.memo||'').trim(),source:(r.source||'').trim(),url:job.url||'',videos:job.links||[],
    words:(r.search_words||[]).map(String).slice(0,30),rawText:job.text||'',imageIds:job.imageIds,coverId:null,thumb:null,createdAt:job.createdAt,updatedAt:Date.now()};
  try{ // 料理写真を切り抜いて表紙にする
    const p=r.photo,bx=p&&p.box_2d;
    if(p&&p.image_index>=0&&p.image_index<blobs.length&&Array.isArray(bx)&&bx.length===4){
      const im=await loadImg(blobs[p.image_index]); const W=im.naturalWidth,H=im.naturalHeight;
      const [y0,x0,y1,x1]=bx.map(v=>Math.max(0,Math.min(1000,+v||0))/1000);
      const sw=(x1-x0)*W,sh=(y1-y0)*H;
      if(sw>W*.25&&sh>H*.12)await setCover(rec,im,x0*W,y0*H,sw,sh);
    }
  }catch(e){/* 表紙が作れなくてもレシピは保存する */}
  await saveRecipe(rec); await dbDel('jobs',job.id);
  toast('「'+rec.title+'」を読み取りました');
}
async function setCover(rec,im,sx,sy,sw,sh){
  const big=await toBlob(drawTo(im,sx,sy,sw,sh,1400),.86);
  rec.coverId=rec.id+'-cover'; await putImage(rec.coverId,big);
  rec.thumb=drawTo(im,sx,sy,sw,sh,520).toDataURL('image/jpeg',.8);
}
async function saveRecipe(rec){
  const {_ix,...plain}=rec; await dbPut('recipes',plain);
  rec._ix=indexOf(rec); const i=R.findIndex(x=>x.id===rec.id); if(i>=0)R[i]=rec; else R.unshift(rec);
  R.sort((a,b)=>b.createdAt-a.createdAt); if(route().name==='home')render();
}
async function deleteRecipe(rec){
  for(const id of [...(rec.imageIds||[]),rec.coverId])if(id)await dbDel('images',id);
  await dbDel('recipes',rec.id); R=R.filter(x=>x.id!==rec.id);
}
async function addJob(text,url,blobs,links){
  const id=uid(); const imageIds=[];
  for(let i=0;i<blobs.length;i++){const iid=id+'-'+i;await putImage(iid,blobs[i]);imageIds.push(iid);}
  await dbPut('jobs',{id,createdAt:Date.now(),text:text||'',url:url||'',links:links||[],imageIds,status:'pending',tries:0,nextAt:0});
}

  else if(paused==='day'){msg='今日の無料ぶんを使い切りました。残り'+pend+'件は、明日「続きから読み取る」で再開できます。';stop=true;}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!pdfjsP)pdfjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';res(window.pdfjsLib);};
    s.onerror=()=>{pdfjsP=null;s.remove();rej(new Error('PDFを開く部品を取ってこられませんでした。電波のよいところでもう一度試してください。'))};document.head.append(s);});
  return pdfjsP;
}
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');
// PDFを1ページずつ画像にして渡す。onPage(大きい画像, ページ番号, 全ページ数, ページの中の動画リンク)
async function eachPdfPage(file,onPage){
  const lib=await loadPdfJs(); let pdf;
  try{pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;}
  catch(e){throw new Error(e&&e.name==='PasswordException'?'このPDFには鍵（パスワード）がかかっていて開けませんでした':'このPDFは開けませんでした');}
  try{
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n); const v1=page.getViewport({scale:1});
      const vp=page.getViewport({scale:Math.min(4,2400/Math.max(v1.width,v1.height))});
      const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:g,viewport:vp}).promise;
      const big=await toBlob(c,.92); c.width=c.height=1;
      let links=[]; try{links=(await page.getAnnotations()).map(a=>a.url||'').filter(u=>u&&videoEmbed(u));}catch(e){}
      page.cleanup(); await onPage(big,n,pdf.numPages,links);
    }
  }finally{pdf.destroy();}
}

async function openCrop(r,blob){
  const im=await loadImg(blob); const W=im.naturalWidth,H=im.naturalHeight; const cv=h('canvas',{width:640,height:800}); const g=cv.getContext('2d');
  const base=Math.max(640/W,800/H); let zoom=1,cx=W/2,cy=H/2;
  const rect=()=>{const s=base*zoom,sw=640/s,sh=800/s; cx=Math.max(sw/2,Math.min(W-sw/2,cx)); cy=Math.max(sh/2,Math.min(H-sh/2,cy)); return [cx-sw/2,cy-sh/2,sw,sh];};
  const draw=()=>{const [sx,sy,sw,sh]=rect(); g.drawImage(im,sx,sy,sw,sh,0,0,640,800);};
  let last=null;
  cv.addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!last)return;const k=640/cv.getBoundingClientRect().width/(base*zoom);cx-=(e.clientX-last[0])*k;cy-=(e.clientY-last[1])*k;last=[e.clientX,e.clientY];draw();});
  const end=()=>{last=null}; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  const range=h('input',{type:'range',min:1,max:5,step:.01,value:1,'aria-label':'大きさ',oninput:e=>{zoom=+e.target.value;draw();}});
  openDlg('crop',h('div',{class:'sheet'},h('h2',{},'写真の位置を決める'),h('div',{class:'cropwrap'},cv),
    h('p',{class:'hint'},'指で動かして位置を、下のつまみで大きさを決めます。'),range,
    h('div',{class:'bar'},h('button',{class:'btn',onclick:async()=>{const [sx,sy,sw,sh]=rect();await setCover(r,im,sx,sy,sw,sh);r.updatedAt=Date.now();await saveRecipe(r);closeDlg();toast('表紙を変えました');if(route().name!=='e')render();}},'これにする'),

  draw();
}

        const c=cats.value.split('\n').map(s=>s.trim()).filter(Boolean); if(c.length)S.cats=[...new Set(c)]; S.syn=syn.value; toast('設定を保存しました'); render();}},'設定を保存する'))
    ,h('div',{class:'section'},h('h3',{},'バックアップ'),
      h('p',{class:'hint',style:'margin:0 0 10px'},days==null?'まだバックアップしていません。':'前回のバックアップから'+days+'日たっています。','　レシピはこの端末の中にあります。ときどきファイルに書き出しておくと安心です。'),
      h('label',{class:'check'},withOrig,h('span',{},'元のスクショも入れる（はずすとファイルが軽くなります）')),
      h('div',{class:'bar',style:'margin-top:8px'},h('button',{class:'btn',onclick:e=>exportBackup(withOrig.checked,e.target)},'バックアップを書き出す'),
        h('button',{class:'btn quiet',onclick:()=>imp.click()},'バックアップから読み込む'),imp))
    ,h('div',{class:'section'},h('h3',{},'このアプリの版'),
      h('p',{class:'hint',style:'margin:0 0 10px'},'いまの版: '+VERSION),
      h('button',{class:'btn quiet',onclick:async e=>{e.target.disabled=true;e.target.textContent='新しい版を取りにいっています…';
        try{await fetch(location.pathname,{cache:'reload'});}catch(err){}
        location.reload();}},'最新の版にする'),
      h('p',{class:'hint'},'GitHubに新しいファイルを置いたあと、ここを押すと入れ替わります。置いてから1〜2分は古いままのことがあります。'))));
  window.scrollTo(0,0);
}

/* ================= バックアップ ================= */
async function exportBackup(withOrig,btn){
  btn.disabled=true; const label=btn.textContent;
  try{
    const parts=[JSON.stringify({type:'meta',app:'recipebook',version:1,exportedAt:new Date().toISOString(),settings:{cats:S.cats,syn:S.syn,title:S.title,tone:S.tone}})+'\n'];
    let n=0;
    for(const r of R){
      const {_ix,...data}=r; const images=[];
      for(const iid of [...(withOrig?(r.imageIds||[]):[]),r.coverId].filter(Boolean)){const rec=await dbGet('images',iid); if(rec)images.push({id:iid,type:rec.type,data:await toB64(new Blob([rec.buf]))});}
      if(!withOrig)data.imageIds=[];
      parts.push(JSON.stringify({type:'recipe',data,images})+'\n'); btn.textContent='書き出しています '+(++n)+'/'+R.length;
    }
    const d=new Date(); const name='recipes-backup-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    const file=new File(parts,name,{type:'application/json'});
    let done=false;
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});done=true;}catch(e){if(e.name==='AbortError'){toast('書き出しをやめました');return;}}}
    if(!done){const u=URL.createObjectURL(file);const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);}
    S.lastBackup=Date.now(); toast(R.length+'件を書き出しました');
  }catch(e){toast('書き出せませんでした：'+e.message,5000);}
  finally{btn.disabled=false;btn.textContent=label;}
}
async function* fileLines(file){
  if(file.stream&&window.TextDecoderStream){
    const rd=file.stream().pipeThrough(new TextDecoderStream()).getReader(); let buf='';
    for(;;){const {value,done}=await rd.read(); if(done)break; buf+=value; let i; while((i=buf.indexOf('\n'))>=0){yield buf.slice(0,i);buf=buf.slice(i+1);}}
    if(buf.trim())yield buf;
  }else for(const l of (await file.text()).split('\n'))if(l.trim())yield l;
}
async function importBackup(file){
  let n=0,ok=false;
  try{
    for await(const line of fileLines(file)){
      if(!line.trim())continue; const o=JSON.parse(line);
      if(o.type==='meta'){ if(o.app!=='recipebook')throw new Error('このアプリのバックアップではないようです'); ok=true;
        const s=o.settings||{}; if(Array.isArray(s.cats)&&s.cats.length)S.cats=[...new Set([...S.cats,...s.cats])]; if(typeof s.syn==='string'&&S.syn===DEFAULT_SYN)S.syn=s.syn; if(s.title&&S.title==="Nokka's Recipes")S.title=s.title; }
      else if(o.type==='recipe'){ if(!ok)throw new Error('このアプリのバックアップではないようです');
        for(const im of o.images||[]){const bin=atob(im.data);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await dbPut('images',{id:im.id,type:im.type,buf:u.buffer});}
        await dbPut('recipes',o.data); n++; if(n%5===0)toast(n+'件読み込みました…'); }
    }
    await loadAll(); toast(n+'件のレシピを読み込みました'); render();
  }catch(e){await loadAll(); toast('読み込めませんでした：'+e.message+(n?'（'+n+'件までは入りました）':''),6000); render();}
}

/* ================= はじまり ================= */
async function loadAll(){R=(await dbAll('recipes')).map(r=>{r.ingredients=r.ingredients||[];r.steps=r.steps||[];r._ix=indexOf(r);return r;}).sort((a,b)=>b.createdAt-a.createdAt);}
$('#btnAdd').addEventListener('click',openAdd);
$('#btnSettings').addEventListener('click',()=>go('#/settings'));
window.addEventListener('hashchange',()=>{closeDlg();render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!paused)pump();});
(async()=>{
  try{db=await openDB();await loadAll();}
  catch(e){$('#app').append(h('p',{class:'empty'},'保存場所をひらけませんでした。Safariの「プライベートブラウズ」では使えません。ふつうの画面でひらき直してください。'));return;}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render(); pump();
})();
